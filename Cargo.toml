[workspace]
members = ["core", "src-tauri", "crates/phemios-cd", "crates/phemios-transfer", "crates/phemios-glib-regression"]
resolver = "2"
exclude = ["vendor/glib", "vendor/glib-macros", "vendor/gtk3-macros", "vendor/keepawake"]
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
[workspace.dependencies]
# Shared audio is immutable and available without a sibling Aède checkout.
aede-audio = { git = "https://github.com/craft-and-code/aede", rev = "ed11c97285745b26233910e82a8e72e6d441797f", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
# GLib 0.18 API with the upstream VariantStrIter soundness correction.
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
keepawake = { path = "vendor/keepawake" }
