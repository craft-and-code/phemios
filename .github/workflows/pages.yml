name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native documentation and engine prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev libssl-dev \
            build-essential pkg-config autoconf automake libtool
      - run: npm ci
      - name: Prepare the latest published stable engine for native Rustdoc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-engine.mjs
      - name: Verify website and manual behavior
        run: node --test tests/site.test.mjs
      - name: Build frontend assets required by the native Rustdoc context
        run: npm run build
      - name: Build website, manual and technical documentation
        run: npm run site:build
      - name: Check the assembled website
        run: npm run site:check
      - name: Upload the checked website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
