name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-AppleSilicon
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            label: Linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - os: windows-latest
            label: Windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: craft-and-code/aede
          ref: v0.6.1
          path: .engine-cache/aede-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .engine-cache/aede-source -> target
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev libssl-dev build-essential autoconf automake libtool squashfs-tools
      - name: Install macOS autotools for the embedded engine
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Refuse a mislabeled runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual" = "${{ matrix.target }}"
      - run: npm ci
      - name: Verify manifest and tag versions
        run: node scripts/release.mjs verify
      - name: Fetch locked dependencies explicitly
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path .engine-cache/aede-source/Cargo.toml
      - name: Verify frontend and tooling
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run check:tauri
      - name: Verify Rust formatting and core
        run: |
          cargo fmt --all -- --check
          cargo test -p phemios-core --locked
          cargo clippy -p phemios-core --all-targets --locked -- -D warnings
      - name: Build native installers with the pinned engine
        env:
          PHEMIOS_AEDE_SOURCE: ${{ github.workspace }}/.engine-cache/aede-source
        run: npx --no-install tauri build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Name installers and generate SHA-256 sidecars
        run: node scripts/release.mjs package ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: phemios-App-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phemios-App-*
          path: dist-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Phémios ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist-release/*
          fail_on_unmatched_files: true
          body_path: docs/releases/downloads.md
