[package]
name = "phemios-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
# Shared catalogue-independent PCM foundation, developed alongside Aède.
aede-audio = { path = "../../aede/crates/aede-audio", features = ["queue"] }
phemios-cd = { path = "../crates/phemios-cd" }
ureq = "=3.4.0"
serde_json = "1"

cpal = "=0.18.1"
tungstenite = { version = "=0.24.0", features = ["rustls-tls-native-roots"] }
getrandom = "=0.4.3"
quick-xml = "=0.42.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scraper = { version = "=0.27.0", default-features = false }
url = "=2.5.8"
